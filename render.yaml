services:
  - type: web
    name: real-estate-ai-workforce
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn real_estate_ai_agent:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: META_VERIFY_TOKEN
        sync: false
